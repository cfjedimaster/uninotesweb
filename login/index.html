<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="color-scheme" content="light dark" />
    <script>
      try {
        const saved = localStorage.getItem('uninote-theme');
        if (saved === 'light' || saved === 'dark') {
          document.querySelector('meta[name="color-scheme"]').content = saved;
          document.documentElement.dataset.theme = saved;
        }
      } catch {}
    </script>
    <meta name="theme-color" content="#f3eaff" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script src="https://accounts.google.com/gsi/client" async fetchpriority="high"></script>
    <title>Log in — Uninote</title>
  </head>
  <body>
    <main class="login-card" x-data="loginPage" x-cloak x-show="ready">
      <div class="rainbow" aria-hidden="true">
        <i></i><i></i><i></i><i></i><i></i>
      </div>

      <div class="login-topbar">
        <a href="/" class="back-link">← Back to home</a>
        <div class="theme-switch" role="group" aria-label="Theme">
          <button type="button" class="sun" :class="{ 'selected-theme': theme === 'light' }"
            :aria-pressed="theme === 'light'" aria-label="Light theme" title="Light theme"
            @click="setTheme('light')">☼</button>
          <button type="button" class="moon" :class="{ 'selected-theme': theme === 'dark' }"
            :aria-pressed="theme === 'dark'" aria-label="Dark theme" title="Dark theme"
            @click="setTheme('dark')">☾</button>
        </div>
      </div>

      <div class="login-header">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">✦</span>
          <span>Uninote</span>
        </div>
        <h1>Welcome back</h1>
        <p>Sign in with your Google account to open your notebooks.</p>
      </div>

      <div class="login-body">
        <div class="google-gis-wrap" x-show="configured && hasClientId && !gisFailed">
          <div class="google-gis-placeholder" x-show="!gisReady" aria-live="polite">
            Preparing sign-in…
          </div>
          <div
            class="google-gis-slot"
            x-ref="googleButtonSlot"
            x-show="gisReady"
            :class="{ 'is-busy': loading }"
          ></div>
          <p class="signing-in-status" x-show="loading" aria-live="polite">
            Signing you in…
          </p>
        </div>

        <button type="button" class="google-button"
          x-show="!hasClientId || gisFailed || !configured"
          @click="signInWithOAuthFallback"
          :disabled="loading || !configured">
          <svg aria-hidden="true" viewBox="0 0 24 24">
            <path fill="#EA4335" d="M12 10.2v3.9h5.5c-.2 1.3-1.6 3.8-5.5 3.8-3.3 0-6-2.7-6-6s2.7-6 6-6c1.9 0 3.1.8 3.8 1.5l2.6-2.5C16.8 3.4 14.6 2.5 12 2.5 6.8 2.5 2.5 6.8 2.5 12s4.3 9.5 9.5 9.5c5.5 0 9.1-3.9 9.1-9.3 0-.6-.1-1.1-.2-1.6H12z"/>
            <path fill="#34A853" d="M3.6 7.4l3.2 2.4C7.7 7.6 9.7 6 12 6c1.9 0 3.1.8 3.8 1.5l2.6-2.5C16.8 3.4 14.6 2.5 12 2.5 8.3 2.5 5.2 4.6 3.6 7.4z"/>
            <path fill="#FBBC05" d="M12 21.5c2.5 0 4.7-.8 6.3-2.3l-2.9-2.4c-.8.6-1.9 1.1-3.4 1.1-3.8 0-5.2-2.5-5.5-3.8l-3.2 2.5c1.6 3 4.8 4.9 8.7 4.9z"/>
            <path fill="#4285F4" d="M21.1 12.2c0-.6-.1-1.1-.2-1.6H12v3.9h5.5c-.3 1.4-1.1 2.5-2.1 3.2l2.9 2.4c1.7-1.6 2.8-4 2.8-7.9z"/>
          </svg>
          <span x-text="loading ? 'Signing you in…' : 'Continue with Google'"></span>
        </button>

        <div class="login-alert" role="alert" x-show="errorMessage" x-text="errorMessage"></div>
      </div>

      <p class="login-footnote">
        Your notes are private to your account—only you can read or edit them.
      </p>
    </main>
    <script type="module" src="/src/login.js"></script>
  </body>
</html>
