<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f3eaff" />
    <script>
      try {
        const saved = localStorage.getItem('uninote-theme');
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        const resolved = saved === 'light' || saved === 'dark' ? saved : (prefersDark ? 'dark' : 'light');
        if (saved === 'light' || saved === 'dark') {
          document.querySelector('meta[name="color-scheme"]').content = saved;
          document.documentElement.dataset.theme = saved;
        }
        document.querySelector('meta[name="theme-color"]').content = resolved === 'dark' ? '#21183a' : '#f3eaff';
      } catch {}
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Uninote</title>
  </head>
  <body>
    <main class="app-window" x-data="uninote" x-cloak x-show="authReady"
      @keydown.window="handleGlobalKeydown($event)"
      @beforeunload.window="onBeforeUnload">
      <div class="workspace" :data-mobile-view="mobileView">
        <div class="sidebar-drawer" :class="{ 'is-open': drawerVisible }" x-ref="sidebarDrawer">
          <div class="drawer-backdrop" aria-hidden="true"></div>
          <div class="sidebar-scroller" x-ref="sidebarScroller" @click="handleDrawerBackdropClick($event)">
            <aside class="sidebar" id="notebooks-drawer" x-ref="sidebarSheet" tabindex="-1">
              <div class="brand">
                <span class="brand-mark" aria-hidden="true">✦</span>
                <span class="brand-name">Uninote</span>
                <div class="theme-switch" role="group" aria-label="Theme">
                  <button type="button" class="sun" :class="{ 'selected-theme': theme === 'light' }"
                    :aria-pressed="theme === 'light'" aria-label="Light theme" title="Light theme"
                    @click="setTheme('light')">☼</button>
                  <button type="button" class="moon" :class="{ 'selected-theme': theme === 'dark' }"
                    :aria-pressed="theme === 'dark'" aria-label="Dark theme" title="Dark theme"
                    @click="setTheme('dark')">☾</button>
                </div>
                <button type="button" class="drawer-close icon-button" aria-label="Close notebooks"
                  title="Close notebooks" @click="closeDrawer">×</button>
              </div>

              <search class="sidebar-search">
                <form class="sidebar-search-form" role="search" @submit.prevent="submitSearch">
                  <label for="sidebar-search-input" class="visually-hidden">Search all notes</label>
                  <svg class="sidebar-search-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
                    <circle cx="11" cy="11" r="7"></circle>
                    <path d="m20 20-3.5-3.5"></path>
                  </svg>
                  <input id="sidebar-search-input" x-ref="searchInput" class="sidebar-search-input"
                    type="search" name="q" placeholder="Search all notes…"
                    autocorrect="off" autocapitalize="none" spellcheck="false" enterkeyhint="search"
                    x-model="searchQuery"
                    @input="onSearchInput"
                    @keydown.enter="handleSearchEnter($event)"
                    @keydown.escape="handleSearchEscape($event)">
                  <button type="button" class="sidebar-search-clear icon-button"
                    x-show="searchQuery.trim().length > 0"
                    aria-label="Clear search" title="Clear search"
                    @click="clearSearch({ focusInput: true })">×</button>
                </form>
              </search>

              <div class="sidebar-heading">
                <span>Notebooks</span>
              </div>

              <nav class="notebook-list" aria-label="Notebooks">
                <div class="notebook-row" x-show="isSearching">
                  <button type="button" class="notebook selected search-results-item" aria-pressed="true"
                    @click="closeDrawer">
                    <span class="dot search-dot" aria-hidden="true"></span>
                    <span class="notebook-name">Search results</span>
                    <span class="count" x-text="searching ? '…' : notes.length"></span>
                  </button>
                  <button type="button" class="notebook-delete search-clear-row icon-button"
                    aria-label="Exit search results" title="Exit search results"
                    @click="clearSearch()">×</button>
                </div>
                <template x-for="(notebook, index) in notebooks" :key="notebook.id">
                  <div class="notebook-row">
                    <button type="button" class="notebook" :class="{ selected: !isSearching && index === selectedNotebook }"
                      :aria-pressed="!isSearching && index === selectedNotebook" @click="switchNotebook(index)">
                      <span class="dot" :class="['pink', 'purple', 'blue', 'yellow', 'mint'][index % 5]"></span>
                      <span class="notebook-name" x-text="notebook.name"></span>
                      <span class="count" x-text="notebook.noteCount"></span>
                    </button>
                    <button type="button" class="notebook-delete icon-button"
                      :aria-label="'Delete ' + notebook.name" title="Delete notebook"
                      @click="openDeleteNotebookDialog(index)">×</button>
                  </div>
                </template>
              </nav>

              <div class="sidebar-bottom">
                <button type="button" class="new-notebook" aria-label="New notebook" title="New notebook"
                  @click="openNewNotebookModal">
                  <span>＋</span>New notebook
                </button>
                <div class="account-bar" x-show="user">
                  <div class="account-info" :title="userEmail">
                    <span class="account-avatar" aria-hidden="true" x-text="userInitial"></span>
                    <span class="account-email" x-text="userDisplayName"></span>
                  </div>
                  <button type="button" class="logout-button" @click="logout" :disabled="loggingOut"
                    aria-label="Log out" title="Log out">
                    <span x-text="loggingOut ? '…' : 'Log out'"></span>
                  </button>
                </div>
              </div>
            </aside>
          </div>
        </div>

        <section class="notes-panel" x-ref="notesPanel" aria-label="Notes">
          <div class="notes-heading">
            <div class="notes-heading-lead">
              <button type="button" class="drawer-toggle" x-ref="drawerToggle"
                aria-label="Notebooks" title="Notebooks" aria-controls="notebooks-drawer"
                :aria-expanded="drawerOpen ? 'true' : 'false'" @click="openDrawer">
                <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                  stroke-width="2" stroke-linecap="round">
                  <path d="M4 7h16M4 12h16M4 17h16"></path>
                </svg>
              </button>
              <div class="notes-heading-text">
                <h1 x-text="panelHeading"></h1>
                <p role="status" aria-live="polite" x-text="panelSubheading"></p>
              </div>
            </div>
            <div class="notes-heading-actions">
              <button type="button" class="clear-search-button" x-show="isSearching"
                @click="clearSearch()">Clear search</button>
              <button type="button" class="add-note" aria-label="New note" title="New note"
                x-show="!isSearching"
                @click="createNote" :disabled="selectedNotebook === null">+</button>
            </div>
          </div>

          <div class="note-list" role="listbox" aria-label="Notes" tabindex="0"
            x-show="notes.length > 0"
            @keydown.up.prevent="moveSelection(-1)" @keydown.down.prevent="moveSelection(1)">
            <template x-for="note in notes" :key="note.id">
              <article class="note-card" role="option" :aria-selected="note.id === selectedNoteId"
                :class="{ 'selected-note': note.id === selectedNoteId }" tabindex="0"
                @click="selectNote(note, { openEditor: true })"
                @keydown.enter.prevent="selectNote(note, { openEditor: true })">
                <div class="note-card-header">
                  <h2 :class="{ 'untitled-note': !note.title.trim() }"
                    x-text="note.title.trim() || 'Untitled note'"></h2>
                  <span class="note-notebook-badge" x-show="isSearching && notebookNameFor(note.notebookId)">
                    <span class="dot" :class="notebookColorFor(note.notebookId)" aria-hidden="true"></span>
                    <span x-text="notebookNameFor(note.notebookId)"></span>
                  </span>
                </div>
                <p x-text="note.content"></p>
              </article>
            </template>
          </div>

          <div class="empty-state mobile-empty-state" x-show="notes.length === 0">
            <span class="empty-unicorn" aria-hidden="true" x-text="isSearching ? '🔍' : '🦄'"></span>
            <h2 x-text="isSearching ? (searching ? 'Searching notes…' : 'No matching notes') : (selectedNotebook === null ? 'No notebook selected' : 'No notes yet')"></h2>
            <p x-show="isSearching && !searching">Try a different keyword or phrase.</p>
            <p x-show="!isSearching && selectedNotebook !== null">Start with a little sparkle.</p>
            <p x-show="!isSearching && selectedNotebook === null">Create a notebook to start jotting things down.</p>
            <button type="button" class="empty-action" x-show="isSearching && !searching"
              @click="clearSearch()">Clear search</button>
            <button type="button" class="empty-action" x-show="!isSearching && selectedNotebook !== null"
              @click="createNote">Write your first note</button>
            <button type="button" class="empty-action" x-show="!isSearching && selectedNotebook === null"
              @click="openNewNotebookModal">Create a notebook</button>
          </div>
        </section>

        <section class="editor" x-ref="editorPanel" aria-label="Note editor">
          <template x-if="selectedNote">
            <div class="editor-active">
              <div class="rainbow" aria-hidden="true">
                <i></i>
                <i></i>
                <i></i>
                <i></i>
                <i></i>
              </div>
              <div class="editor-toolbar">
                <button type="button" class="mobile-back" @click="backToList($event)">
                  <span aria-hidden="true">←</span>
                  <span><span class="visually-hidden">Back to </span>Notes</span>
                </button>
                <span class="last-edited">
                  <span class="clock-icon" aria-hidden="true">◷</span>
                  <span>Last edited <span x-text="formatLastEdited(selectedNote.updatedAt)"></span></span>
                  <span class="saved-indicator" x-show="savedPulse" x-transition.opacity>✓ Saved</span>
                </span>
                <div class="editor-actions">
                  <button class="copy-note" type="button" aria-label="Copy note" title="Copy note"
                    @click="copySelectedNote">
                    <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                      stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                      <rect x="8" y="8" width="12" height="12" rx="2"></rect>
                      <path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"></path>
                    </svg>
                  </button>
                  <button class="delete-note" type="button" aria-label="Delete note" title="Delete note"
                    @click="deleteSelectedNote">♜</button>
                </div>
              </div>
              <div class="save-error" role="alert" x-show="saveError" x-text="saveError"></div>
              <div class="note-content">
                <input class="note-title" x-ref="noteTitle" type="text" placeholder="Untitled note"
                  aria-label="Note title" x-model="selectedNote.title"
                  @input="scheduleSave(selectedNote)" @blur="flushCurrent"
                  @keydown.enter.prevent="$refs.noteBody.focus()">
                <textarea class="note-body" x-ref="noteBody" placeholder="Start writing…"
                  aria-label="Note body" x-model="selectedNote.content"
                  @input="scheduleSave(selectedNote)" @blur="flushCurrent"></textarea>
              </div>
            </div>
          </template>
          <template x-if="!selectedNote">
            <div class="empty-state">
              <span class="empty-unicorn" aria-hidden="true" x-text="isSearching ? '🔍' : '🦄'"></span>
              <h2 x-text="isSearching ? (searching ? 'Searching notes…' : 'No matching notes') : (selectedNotebook === null ? 'No notebook selected' : 'No notes yet')"></h2>
              <p x-show="isSearching && !searching">Try a different keyword or phrase.</p>
              <p x-show="!isSearching && selectedNotebook !== null">Start with a little sparkle.</p>
              <p x-show="!isSearching && selectedNotebook === null">Create a notebook to start jotting things down.</p>
              <button type="button" class="empty-action" x-show="isSearching && !searching"
                @click="clearSearch()">Clear search</button>
              <button type="button" class="empty-action" x-show="!isSearching && selectedNotebook !== null"
                @click="createNote">Write your first note</button>
              <button type="button" class="empty-action" x-show="!isSearching && selectedNotebook === null"
                @click="openNewNotebookModal">Create a notebook</button>
            </div>
          </template>
        </section>
      </div>

      <div class="toast" role="status" aria-live="polite" x-show="toastVisible" x-transition.opacity>
        <span>Note deleted.</span>
        <button type="button" @click="undoDelete">Undo</button>
      </div>

      <dialog class="notebook-dialog" closedby="any" aria-labelledby="new-notebook-title" x-ref="newNotebookDialog">
        <form class="notebook-form" @submit.prevent="saveNewNotebook">
          <h2 id="new-notebook-title">New notebook</h2>
          <label for="notebook-name">Notebook name</label>
          <input id="notebook-name" x-ref="notebookName" type="text" autofocus autocomplete="off">
          <p class="notebook-error" role="alert" x-show="notebookError" x-text="notebookError"></p>
          <div class="notebook-dialog-actions">
            <button class="notebook-cancel" type="button" @click="$refs.newNotebookDialog.close()">Cancel</button>
            <button class="notebook-save" type="submit">Save</button>
          </div>
        </form>
      </dialog>

      <dialog class="notebook-dialog delete-notebook-dialog" aria-labelledby="delete-notebook-title" x-ref="deleteNotebookDialog">
        <div class="notebook-form">
          <h2 id="delete-notebook-title">Delete notebook?</h2>
          <p class="delete-notebook-message" x-text="deleteNotebookMessage"></p>
          <p class="notebook-error" role="alert" x-show="notebookError" x-text="notebookError"></p>
          <div class="notebook-dialog-actions">
            <button class="notebook-cancel" type="button" autofocus @click="$refs.deleteNotebookDialog.close()">Cancel</button>
            <button class="notebook-save danger-button" type="button" @click="confirmDeleteNotebook">Delete</button>
          </div>
        </div>
      </dialog>
    </main>
    <script type="module" src="/src/notes.js"></script>
  </body>
</html>
